name: Validate demo
on:
  push:
    branches: [cloud]
    paths-ignore: ['.agents/**', 'docs/**', '*.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aws-demo
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: go test ./cmd/videohelper ./internal/... ./deploy/aws
      - run: node --test deploy/aws/demo-auth.test.mjs
      - run: python3 -m unittest discover -s deploy/aws -p 'test_*.py'
      - run: npm --prefix web ci && npm --prefix web run build
