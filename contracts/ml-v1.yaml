openapi: 3.1.0
info:
  title: VideoHelper ML
  version: 1.0.0
  description: 内部 ML 契约 v1。仅传 S3 引用和绝对毫秒窗口；模型专属限制由 /v1/spaces 报告。WeMM 编码文字、视频、图片；CLAP 编码声音，查询文字原样传入，不做翻译。
paths:
  /healthz:
    get:
      summary: Healthz
      operationId: healthz_healthz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    const: ok
                required:
                - status
                additionalProperties: false
          headers:
            X-Request-ID:
              schema:
                type: string
              description: 沿用请求 id；健康检查可生成。
  /readyz:
    get:
      summary: Readyz
      operationId: readyz_readyz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    const: ok
                required:
                - status
                additionalProperties: false
          headers:
            X-Request-ID:
              schema:
                type: string
              description: 沿用请求 id；健康检查可生成。
        '503':
          description: busy / not_ready：队列满、缓存占用或模型未就绪。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          headers:
            X-Request-ID:
              schema:
                type: string
            Retry-After:
              schema:
                type: integer
                const: 2
  /v1/spaces:
    get:
      summary: Spaces
      operationId: spaces_v1_spaces_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpacesResponse'
          headers:
            X-Request-ID:
              schema:
                type: string
              description: 沿用请求 id；健康检查可生成。
        '400':
          description: invalid_input：请求、输入类型、批量或时间窗口不合法。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          headers:
            X-Request-ID:
              schema:
                type: string
        '401':
          description: unauthorized：内部共享令牌不匹配。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          headers:
            X-Request-ID:
              schema:
                type: string
        '404':
          description: unknown_space / unknown_model：本实例没有该模型。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          headers:
            X-Request-ID:
              schema:
                type: string
        '422':
          description: media_unreadable：无法读取或解码媒体。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          headers:
            X-Request-ID:
              schema:
                type: string
        '500':
          description: internal：推理失败或输出校验失败。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          headers:
            X-Request-ID:
              schema:
                type: string
        '503':
          description: busy / not_ready：队列满、缓存占用或模型未就绪。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          headers:
            X-Request-ID:
              schema:
                type: string
            Retry-After:
              schema:
                type: integer
                const: 2
        '504':
          description: deadline_exceeded：超过调用方剩余等待时间。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          headers:
            X-Request-ID:
              schema:
                type: string
      security:
      - InternalToken: []
      parameters:
      - name: X-Request-ID
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 256
      - name: X-Timeout-Ms
        in: header
        required: false
        schema:
          type: integer
          minimum: 1
        description: 从收到请求开始计时。超时排队请求不再推理；已开始的线程保留并发槽直到退出。
      - name: traceparent
        in: header
        required: false
        schema:
          type: string
  /v1/embed:
    post:
      summary: Embed
      operationId: embed_v1_embed_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbedRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbedResponse'
          headers:
            X-Request-ID:
              schema:
                type: string
              description: 沿用请求 id；健康检查可生成。
        '400':
          description: invalid_input：请求、输入类型、批量或时间窗口不合法。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          headers:
            X-Request-ID:
              schema:
                type: string
        '401':
          description: unauthorized：内部共享令牌不匹配。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          headers:
            X-Request-ID:
              schema:
                type: string
        '404':
          description: unknown_space / unknown_model：本实例没有该模型。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          headers:
            X-Request-ID:
              schema:
                type: string
        '422':
          description: media_unreadable：无法读取或解码媒体。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          headers:
            X-Request-ID:
              schema:
                type: string
        '500':
          description: internal：推理失败或输出校验失败。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          headers:
            X-Request-ID:
              schema:
                type: string
        '503':
          description: busy / not_ready：队列满、缓存占用或模型未就绪。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          headers:
            X-Request-ID:
              schema:
                type: string
            Retry-After:
              schema:
                type: integer
                const: 2
        '504':
          description: deadline_exceeded：超过调用方剩余等待时间。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          headers:
            X-Request-ID:
              schema:
                type: string
      security:
      - InternalToken: []
      parameters:
      - name: X-Request-ID
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 256
      - name: X-Timeout-Ms
        in: header
        required: false
        schema:
          type: integer
          minimum: 1
        description: 从收到请求开始计时。超时排队请求不再推理；已开始的线程保留并发槽直到退出。
      - name: traceparent
        in: header
        required: false
        schema:
          type: string
      description: 每个输入只含 text、video、audio、image 之一，返回顺序与 inputs 一致。时间窗口满足 0≤start_ms<end_ms，end_ms
        截到媒体结尾；输入数量、类型和时长遵循 /v1/spaces。cosine 向量 L2 归一化，所有值有限。 image 仅包含 S3 uri，不含时间窗口；当前搜索输入仅
        text。
  /v1/transcribe:
    post:
      summary: Transcribe
      operationId: transcribe_v1_transcribe_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TranscribeRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscribeResponse'
          headers:
            X-Request-ID:
              schema:
                type: string
              description: 沿用请求 id；健康检查可生成。
        '400':
          description: invalid_input：请求、输入类型、批量或时间窗口不合法。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          headers:
            X-Request-ID:
              schema:
                type: string
        '401':
          description: unauthorized：内部共享令牌不匹配。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          headers:
            X-Request-ID:
              schema:
                type: string
        '404':
          description: unknown_space / unknown_model：本实例没有该模型。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          headers:
            X-Request-ID:
              schema:
                type: string
        '422':
          description: media_unreadable：无法读取或解码媒体。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          headers:
            X-Request-ID:
              schema:
                type: string
        '500':
          description: internal：推理失败或输出校验失败。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          headers:
            X-Request-ID:
              schema:
                type: string
        '503':
          description: busy / not_ready：队列满、缓存占用或模型未就绪。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          headers:
            X-Request-ID:
              schema:
                type: string
            Retry-After:
              schema:
                type: integer
                const: 2
        '504':
          description: deadline_exceeded：超过调用方剩余等待时间。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          headers:
            X-Request-ID:
              schema:
                type: string
      security:
      - InternalToken: []
      parameters:
      - name: X-Request-ID
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 256
      - name: X-Timeout-Ms
        in: header
        required: false
        schema:
          type: integer
          minimum: 1
        description: 从收到请求开始计时。超时排队请求不再推理；已开始的线程保留并发槽直到退出。
      - name: traceparent
        in: header
        required: false
        schema:
          type: string
      description: 仅识别 [start_ms,end_ms)，end_ms 截到媒体结尾。返回完整媒体 duration_ms；句子和词为整个媒体的绝对时间，保留识别顺序，句子及跨句词序的起点非递减，允许区间重叠、包含和相同起点，结束时间不必递增。每个区间有正时长并位于请求窗口内，词在所属句子内；句子范围取所含词的最早起点和最晚终点。不为消除重叠移动时间或丢词。无语音返回空数组。
  /v1/runtime:
    get:
      summary: Runtime provenance
      operationId: runtime_v1_runtime_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeResponse'
          headers:
            X-Request-ID:
              schema:
                type: string
              description: 沿用请求 id；健康检查可生成。
        '400':
          description: invalid_input：请求、输入类型、批量或时间窗口不合法。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          headers:
            X-Request-ID:
              schema:
                type: string
        '401':
          description: unauthorized：内部共享令牌不匹配。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          headers:
            X-Request-ID:
              schema:
                type: string
        '404':
          description: unknown_space / unknown_model：本实例没有该模型。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          headers:
            X-Request-ID:
              schema:
                type: string
        '422':
          description: media_unreadable：无法读取或解码媒体。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          headers:
            X-Request-ID:
              schema:
                type: string
        '500':
          description: internal：推理失败或输出校验失败。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          headers:
            X-Request-ID:
              schema:
                type: string
        '503':
          description: busy / not_ready：队列满、缓存占用或模型未就绪。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          headers:
            X-Request-ID:
              schema:
                type: string
            Retry-After:
              schema:
                type: integer
                const: 2
        '504':
          description: deadline_exceeded：超过调用方剩余等待时间。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          headers:
            X-Request-ID:
              schema:
                type: string
      security:
      - InternalToken: []
      parameters:
      - name: X-Request-ID
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 256
      - name: X-Timeout-Ms
        in: header
        required: false
        schema:
          type: integer
          minimum: 1
        description: 从收到请求开始计时。超时排队请求不再推理；已开始的线程保留并发槽直到退出。
      - name: traceparent
        in: header
        required: false
        schema:
          type: string
      description: 已加载运行时快照；不包含令牌、缓存路径或对象存储配置。runtime_version 独立于 embedding fingerprint；不得用于判断向量兼容性。
components:
  schemas:
    RuntimeModel:
      additionalProperties: false
      properties:
        id:
          minLength: 1
          pattern: ^[a-z0-9@._-]+$
          title: Id
          type: string
        kind:
          enum:
          - embedder
          - transcriber
          title: Kind
          type: string
        adapter:
          title: Adapter
          type: string
        distribution:
          anyOf:
          - additionalProperties:
              type: string
            type: object
          - type: 'null'
          title: Distribution
        device:
          title: Device
          type: string
        dtype:
          title: Dtype
          type: string
        weights:
          title: Weights
          type: string
        revision:
          anyOf:
          - type: string
          - type: 'null'
          title: Revision
        weights_digest:
          anyOf:
          - type: string
          - type: 'null'
          title: Weights Digest
        fingerprint:
          pattern: ^sha256:[0-9a-f]{64}$
          title: Fingerprint
          type: string
      required:
      - id
      - kind
      - adapter
      - distribution
      - device
      - dtype
      - weights
      - revision
      - weights_digest
      - fingerprint
      title: RuntimeModel
      type: object
    RuntimeResponse:
      additionalProperties: false
      properties:
        runtime_version:
          const: 1
          title: Runtime Version
          type: integer
        service_version:
          title: Service Version
          type: string
        python_version:
          title: Python Version
          type: string
        fake:
          title: Fake
          type: boolean
        models:
          items:
            $ref: '#/components/schemas/RuntimeModel'
          title: Models
          type: array
      required:
      - runtime_version
      - service_version
      - python_version
      - fake
      - models
      title: RuntimeResponse
      type: object
    EmbedInput:
      oneOf:
      - type: object
        properties:
          text:
            type: string
            minLength: 1
        required:
        - text
        additionalProperties: false
      - type: object
        properties:
          video:
            $ref: '#/components/schemas/MediaRef'
        required:
        - video
        additionalProperties: false
      - type: object
        properties:
          audio:
            $ref: '#/components/schemas/MediaRef'
        required:
        - audio
        additionalProperties: false
      - type: object
        properties:
          image:
            $ref: '#/components/schemas/ImageRef'
        required:
        - image
        additionalProperties: false
    EmbedRequest:
      properties:
        space:
          type: string
          minLength: 1
          pattern: ^[a-z0-9@._-]+$
          title: Space
        role:
          type: string
          enum:
          - query
          - document
          title: Role
        inputs:
          items:
            $ref: '#/components/schemas/EmbedInput'
          type: array
          minItems: 1
          title: Inputs
      additionalProperties: false
      type: object
      required:
      - space
      - role
      - inputs
      title: EmbedRequest
    EmbedResponse:
      properties:
        space:
          type: string
          minLength: 1
          pattern: ^[a-z0-9@._-]+$
          title: Space
        fingerprint:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
          title: Fingerprint
        dim:
          type: integer
          exclusiveMinimum: 0.0
          title: Dim
        vectors:
          items:
            items:
              type: number
            type: array
          type: array
          title: Vectors
      additionalProperties: false
      type: object
      required:
      - space
      - fingerprint
      - dim
      - vectors
      title: EmbedResponse
    MediaRef:
      properties:
        uri:
          type: string
          pattern: ^s3://[a-z0-9][a-z0-9.-]*/[^?#]+$
          title: Uri
        start_ms:
          type: integer
          minimum: 0.0
          title: Start Ms
        end_ms:
          type: integer
          exclusiveMinimum: 0.0
          title: End Ms
      additionalProperties: false
      type: object
      required:
      - uri
      - start_ms
      - end_ms
      title: MediaRef
    Sentence:
      properties:
        start_ms:
          type: integer
          minimum: 0.0
          title: Start Ms
        end_ms:
          type: integer
          exclusiveMinimum: 0.0
          title: End Ms
        text:
          type: string
          title: Text
        words:
          items:
            $ref: '#/components/schemas/Word'
          type: array
          title: Words
      additionalProperties: false
      type: object
      required:
      - start_ms
      - end_ms
      - text
      - words
      title: Sentence
    SpaceInfo:
      properties:
        id:
          type: string
          minLength: 1
          pattern: ^[a-z0-9@._-]+$
          title: Id
        dim:
          type: integer
          exclusiveMinimum: 0.0
          title: Dim
        metric:
          type: string
          enum:
          - cosine
          - ip
          - l2
          title: Metric
        query_inputs:
          items:
            type: string
            enum:
            - text
            - video
            - audio
            - image
          type: array
          minItems: 1
          title: Query Inputs
        doc_inputs:
          items:
            type: string
            enum:
            - text
            - video
            - audio
            - image
          type: array
          minItems: 1
          title: Doc Inputs
        max_span_ms:
          anyOf:
          - type: integer
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Max Span Ms
        max_batch:
          type: integer
          exclusiveMinimum: 0.0
          title: Max Batch
        fingerprint:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
          title: Fingerprint
      additionalProperties: false
      type: object
      required:
      - id
      - dim
      - metric
      - query_inputs
      - doc_inputs
      - max_span_ms
      - max_batch
      - fingerprint
      title: SpaceInfo
    SpacesResponse:
      properties:
        spaces:
          items:
            $ref: '#/components/schemas/SpaceInfo'
          type: array
          title: Spaces
        transcribers:
          items:
            $ref: '#/components/schemas/TranscriberInfo'
          type: array
          title: Transcribers
      additionalProperties: false
      type: object
      required:
      - spaces
      - transcribers
      title: SpacesResponse
    TranscribeRequest:
      properties:
        uri:
          type: string
          pattern: ^s3://[a-z0-9][a-z0-9.-]*/[^?#]+$
          title: Uri
        start_ms:
          type: integer
          minimum: 0.0
          title: Start Ms
        end_ms:
          type: integer
          exclusiveMinimum: 0.0
          title: End Ms
        model:
          type: string
          minLength: 1
          pattern: ^[a-z0-9@._-]+$
          title: Model
        language:
          type: string
          minLength: 1
          title: Language
      additionalProperties: false
      type: object
      required:
      - uri
      - start_ms
      - end_ms
      - model
      - language
      title: TranscribeRequest
    TranscribeResponse:
      properties:
        language:
          type: string
          title: Language
        duration_ms:
          type: integer
          minimum: 0.0
          title: Duration Ms
        sentences:
          items:
            $ref: '#/components/schemas/Sentence'
          type: array
          title: Sentences
        model:
          type: string
          minLength: 1
          pattern: ^[a-z0-9@._-]+$
          title: Model
        fingerprint:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
          title: Fingerprint
      additionalProperties: false
      type: object
      required:
      - language
      - duration_ms
      - sentences
      - model
      - fingerprint
      title: TranscribeResponse
    TranscriberInfo:
      properties:
        id:
          type: string
          minLength: 1
          pattern: ^[a-z0-9@._-]+$
          title: Id
        languages:
          items:
            type: string
          type: array
          minItems: 1
          title: Languages
        max_window_ms:
          type: integer
          exclusiveMinimum: 0.0
          title: Max Window Ms
        fingerprint:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
          title: Fingerprint
      additionalProperties: false
      type: object
      required:
      - id
      - languages
      - max_window_ms
      - fingerprint
      title: TranscriberInfo
    Word:
      properties:
        w:
          type: string
          title: W
        s:
          type: integer
          minimum: 0.0
          title: S
        e:
          type: integer
          exclusiveMinimum: 0.0
          title: E
      additionalProperties: false
      type: object
      required:
      - w
      - s
      - e
      title: Word
    ErrorDetail:
      additionalProperties: false
      properties:
        code:
          enum:
          - unauthorized
          - invalid_input
          - unknown_space
          - unknown_model
          - media_unreadable
          - busy
          - not_ready
          - deadline_exceeded
          - internal
          title: Code
          type: string
        message:
          title: Message
          type: string
      required:
      - code
      - message
      title: ErrorDetail
      type: object
    ErrorBody:
      additionalProperties: false
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
      required:
      - error
      title: ErrorBody
      type: object
    ImageRef:
      type: object
      additionalProperties: false
      properties:
        uri:
          type: string
