# 召回通道：每个通道用哪个 space。改这里就能换模型，Go 代码不用动。
# active：参与查询；shadow：只回填和评估，不参与查询。
channels:
  visual:
    doc: video              # 文档输入类型，必须在 space 的 doc_inputs 里
    seg: grid@v1
    weight: 1.0
    active: [wemm-2b@r1]
    shadow: []
  speech:
    doc: text               # 文本，来自 text_span
    seg: sentence@v1
    weight: 1.0
    active: [wemm-2b@r1]
    shadow: []
  audio:
    doc: audio
    seg: grid@v1
    weight: 1.0
    active: [clap-htsat@r1]
    shadow: []
