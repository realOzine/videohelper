name: videohelper
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: videohelper
      POSTGRES_PASSWORD: ${VH_LOCAL_DB_PASSWORD:-videohelper-local}
      POSTGRES_DB: videohelper
    ports:
      - "127.0.0.1:${VH_LOCAL_DB_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U videohelper -d videohelper"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${VH_LOCAL_REDIS_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
  minio:
    build:
      context: ..
      dockerfile: deploy/minio.Dockerfile
    image: videohelper-minio:2025-10-15
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${VH_LOCAL_S3_USER:-videohelper-local}
      MINIO_ROOT_PASSWORD: ${VH_LOCAL_S3_PASSWORD:-videohelper-local-secret}
    ports:
      - "127.0.0.1:${VH_LOCAL_S3_PORT:-59000}:9000"
      - "127.0.0.1:${VH_LOCAL_S3_CONSOLE_PORT:-59001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres-data:
  minio-data:
