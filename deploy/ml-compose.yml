name: videohelper-ml
services:
  speech-audio:
    platform: linux/amd64
    build:
      context: ..
      dockerfile: ml/Dockerfile
      args:
        ML_PROFILE: speech-audio-cpu
    environment: &environment
      ML_INTERNAL_TOKEN: ${ML_INTERNAL_TOKEN:?set ML_INTERNAL_TOKEN}
      ML_S3_ENDPOINT: ${ML_S3_ENDPOINT:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-1}
    ports:
      - "127.0.0.1:${ML_CPU_PORT:-8001}:8000"
    volumes:
      - speech-audio-cache:/cache
    healthcheck: &healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 120s
  wemm-cuda:
    profiles: [cuda]
    platform: linux/amd64
    build:
      context: ..
      dockerfile: ml/Dockerfile
      args:
        ML_PROFILE: wemm-cuda
    environment: *environment
    ports:
      - "127.0.0.1:${ML_CUDA_PORT:-8002}:8000"
    volumes:
      - wemm-cuda-cache:/cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck: *healthcheck
volumes:
  speech-audio-cache:
  wemm-cuda-cache:
