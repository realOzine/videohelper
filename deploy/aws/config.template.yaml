server:
  addr: :8080
  cors_origins: []
database:
  url_env: VH_DB_URL
  max_conns: 8
redis:
  addr_env: VH_REDIS_ADDR
s3:
  bucket: __MEDIA_BUCKET__
  region: __AWS_REGION__
  endpoint: ''
  presign_ttl: 1h
auth:
  issuer: http://auth:18001
  audience: videohelper-demo
  jwks_url: http://auth:18001/jwks
ml:
  transcriber: paraformer-zh@r1
  endpoints: [http://wemm:8000, http://speech-audio:8000]
  model_endpoints:
    wemm-2b-cpu@r1: http://wemm:8000
    paraformer-zh@r1: http://speech-audio:8000
    clap-htsat-unfused@r1: http://speech-audio:8000
  token_env: VH_ML_TOKEN
  query_timeout: 120s
  embed_timeout: 10m
  embed_batch: 1
  transcribe_chunk_ms: 600000
  transcribe_overlap_ms: 30000
  transcribe_timeout: 10m
worker:
  cpu_concurrency: 1
  gpu_concurrency: 2
  workspace_gpu_limit: 1
  max_retry: 8
  reconcile_every: 5m
media:
  normalized_video_max_height: 720
  normalized_video_gop_seconds: 1
  thumb_width: 320
  sprite_cols: 10
  sprite_rows: 10
  tmp_dir: /var/lib/videohelper/.local
search:
  k: 5
  rrf_k: 60
  merge_gap_cells: 1
  max_limit: 50
  channel_weights: {visual: 1, speech: 1, audio: 0}
import:
  ytdlp_path: /usr/local/bin/yt-dlp
  allow_direct: false
  max_height: 1080
  max_duration_ms: 14400000
  max_bytes: 10737418240
  timeout: 2h
  platforms:
    youtube:
      hosts: [youtube.com, www.youtube.com, m.youtube.com, youtu.be]
      extractors: [youtube]
      max_concurrency: 1
    bilibili:
      hosts: [bilibili.com, www.bilibili.com, m.bilibili.com, b23.tv]
      extractors: [BiliBili]
      max_concurrency: 1
limits:
  upload_part_bytes: 16777216
  soft_delete_purge_after: 720h
  plans:
    free: {indexed_ms_month: 36000000, llm_tokens_day: 200000}
channels_file: /etc/videohelper/channels.yaml
