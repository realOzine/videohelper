version: 0.2
env:
  shell: bash
phases:
  pre_build:
    on-failure: ABORT
    commands:
      - docker info
      - python3 -m unittest discover -s deploy/aws -p 'test_*.py'
      - docker run --rm -v "$CODEBUILD_SRC_DIR:/src" -w /src golang:1.27.3-bookworm go test ./cmd/videohelper ./internal/... ./deploy/aws
      - docker run --rm -v "$CODEBUILD_SRC_DIR:/src:ro" -w /src node:24.21.0-alpine node --test deploy/aws/demo-auth.test.mjs
      - aws ecr get-login-password | docker login --username AWS --password-stdin "${VH_IMAGE_REPOSITORY%%/*}"
  build:
    on-failure: ABORT
    commands:
      - |
        set -euo pipefail
        for image in go web ml-wemm ml-cpu; do
          tag="$image-$CODEBUILD_RESOLVED_SOURCE_VERSION"
          if aws ecr describe-images --repository-name "${VH_IMAGE_REPOSITORY#*/}" --image-ids "imageTag=$tag" >/dev/null 2>&1; then
            continue
          fi
          case "$image" in
            go|web) docker build -f "deploy/aws/$image.Dockerfile" -t "$VH_IMAGE_REPOSITORY:$tag" . ;;
            ml-wemm) docker build -f ml/Dockerfile --build-arg ML_PROFILE=wemm-cpu -t "$VH_IMAGE_REPOSITORY:$tag" . ;;
            ml-cpu) docker build -f ml/Dockerfile --build-arg ML_PROFILE=speech-audio-cpu -t "$VH_IMAGE_REPOSITORY:$tag" . ;;
          esac
          docker push "$VH_IMAGE_REPOSITORY:$tag"
        done
      - python3 deploy/aws/demo.py publish --sha "$CODEBUILD_RESOLVED_SOURCE_VERSION"
      - python3 deploy/aws/demo.py deploy --sha "$CODEBUILD_RESOLVED_SOURCE_VERSION"
