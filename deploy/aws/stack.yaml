AWSTemplateFormatVersion: '2010-09-09'
Description: VideoHelper private single-user demo on one stoppable CPU host, with retained data and no always-on load balancer or NAT.
Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  com.aws.cloudformation.Context:
    ref: [{at: ../../docs/design.md, has: AWS demo deployment and retention constraints}]
Parameters:
  ImageId:
    Type: AWS::EC2::Image::Id
    Description: Pinned ECS optimized AL2023 x86_64 AMI.
  InstanceType:
    Type: String
    Default: r6a.large
    AllowedValues: [r6a.large, r6a.xlarge]
  GitHubRepository:
    Type: String
    Default: realOzine/videohelper
    AllowedPattern: '[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+'
  ConnectionArn:
    Type: String
    Description: Authorized GitHub CodeConnections connection in the project Region.
  BudgetEmail:
    Type: String
    Default: ''
    NoEcho: true
Conditions:
  HasBudgetEmail: !Not [!Equals [!Ref BudgetEmail, '']]
Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.87.0.0/24
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{Key: Project, Value: videohelper}, {Key: Environment, Value: demo}]
  InternetGateway:
    Type: AWS::EC2::InternetGateway
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway
  Subnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.87.0.0/24
      MapPublicIpOnLaunch: true
  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
  Route:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  SubnetRoute:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref Subnet
      RouteTableId: !Ref RouteTable
  HostSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: No inbound access; use SSM port forwarding only
      VpcId: !Ref Vpc
      SecurityGroupIngress: []
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
  # Media and backups survive deletion; deleting the stack does not stop storage billing.
  MediaBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration: [{ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}}]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration: {Status: Enabled}
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: ['http://localhost:8080', 'http://127.0.0.1:8080']
            AllowedMethods: [GET, HEAD, PUT]
            AllowedHeaders: ['*']
            ExposedHeaders: [ETag, Content-Length, Content-Range, Accept-Ranges]
            MaxAge: 3600
      LifecycleConfiguration:
        Rules:
          - Id: BoundOldVersions
            Status: Enabled
            NoncurrentVersionExpiration: {NoncurrentDays: 30}
            AbortIncompleteMultipartUpload: {DaysAfterInitiation: 1}
      Tags: [{Key: Project, Value: videohelper}, {Key: Environment, Value: demo}]
  MediaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MediaBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource: [!GetAtt MediaBucket.Arn, !Sub '${MediaBucket.Arn}/*']
            Condition: {Bool: {'aws:SecureTransport': 'false'}}
  ArtifactsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration: [{ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}}]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration: {Status: Enabled}
      LifecycleConfiguration:
        Rules:
          - Id: BoundOldVersions
            Status: Enabled
            NoncurrentVersionExpiration: {NoncurrentDays: 7}
            AbortIncompleteMultipartUpload: {DaysAfterInitiation: 1}
          - Id: BackupRetention
            Prefix: backups/
            Status: Enabled
            ExpirationInDays: 30
      Tags: [{Key: Project, Value: videohelper}, {Key: Environment, Value: demo}]
  ArtifactsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource: [!GetAtt ArtifactsBucket.Arn, !Sub '${ArtifactsBucket.Arn}/*']
            Condition: {Bool: {'aws:SecureTransport': 'false'}}
  # shortcut: only three pushed releases remain; rebuild an expired SHA before rollback.
  Images:
    Type: AWS::ECR::Repository
    Properties:
      ImageTagMutability: IMMUTABLE
      EncryptionConfiguration: {EncryptionType: AES256}
      ImageScanningConfiguration: {ScanOnPush: true}
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"Keep three go- releases","selection":{"tagStatus":"tagged","tagPrefixList":["go-"],"countType":"imageCountMoreThan","countNumber":3},"action":{"type":"expire"}},{"rulePriority":2,"description":"Keep three web- releases","selection":{"tagStatus":"tagged","tagPrefixList":["web-"],"countType":"imageCountMoreThan","countNumber":3},"action":{"type":"expire"}},{"rulePriority":3,"description":"Keep three ml-wemm- releases","selection":{"tagStatus":"tagged","tagPrefixList":["ml-wemm-"],"countType":"imageCountMoreThan","countNumber":3},"action":{"type":"expire"}},{"rulePriority":4,"description":"Keep three ml-cpu- releases","selection":{"tagStatus":"tagged","tagPrefixList":["ml-cpu-"],"countType":"imageCountMoreThan","countNumber":3},"action":{"type":"expire"}},{"rulePriority":5,"description":"Expire untagged build layers","selection":{"tagStatus":"untagged","countType":"sinceImagePushed","countUnit":"days","countNumber":1},"action":{"type":"expire"}}]}'
      Tags: [{Key: Project, Value: videohelper}, {Key: Environment, Value: demo}]
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{Effect: Allow, Principal: {Service: ec2.amazonaws.com}, Action: 'sts:AssumeRole'}]
      ManagedPolicyArns: [!Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore']
      Policies:
        - PolicyName: DemoDataAndImages
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:ListBucket, s3:GetBucketLocation, s3:ListBucketMultipartUploads]
                Resource: !GetAtt MediaBucket.Arn
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject, s3:AbortMultipartUpload, s3:ListMultipartUploadParts]
                Resource: !Sub '${MediaBucket.Arn}/*'
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub '${ArtifactsBucket.Arn}/releases/*'
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub '${ArtifactsBucket.Arn}/backups/*'
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action: [ecr:BatchGetImage, ecr:GetDownloadUrlForLayer, ecr:BatchCheckLayerAvailability]
                Resource: !GetAtt Images.Arn
  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]
  # Retain the host and root disk: no replacement or termination without a data migration.
  Host:
    Type: AWS::EC2::Instance
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    DependsOn: [Route, SubnetRoute]
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      SubnetId: !Ref Subnet
      SecurityGroupIds: [!Ref HostSecurityGroup]
      DisableApiTermination: true
      InstanceInitiatedShutdownBehavior: stop
      MetadataOptions: {HttpTokens: required, HttpPutResponseHopLimit: 2, HttpEndpoint: enabled}
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: {VolumeSize: 60, VolumeType: gp3, Encrypted: true, DeleteOnTermination: false}
      Tags: [{Key: Name, Value: !Sub '${AWS::StackName}-demo'}, {Key: Project, Value: videohelper}, {Key: Environment, Value: demo}]
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          # Arm cost control before downloads or installs can fail.
          cat >/etc/systemd/system/videohelper-stop.service <<'EOF'
          [Unit]
          Description=Stop the VideoHelper demo session
          [Service]
          Type=oneshot
          ExecStart=/bin/sh -c 'if test -x /opt/videohelper/current/host.sh; then timeout 300 /opt/videohelper/current/host.sh backup; fi; /sbin/shutdown -h now'
          EOF
          cat >/etc/systemd/system/videohelper-stop.timer <<'EOF'
          [Unit]
          Description=Limit each VideoHelper boot to two hours
          [Timer]
          OnBootSec=2h
          AccuracySec=1min
          Unit=videohelper-stop.service
          [Install]
          WantedBy=timers.target
          EOF
          systemctl daemon-reload
          systemctl enable --now videohelper-stop.timer
          systemctl disable --now ecs || true
          dnf install -y docker python3 awscli-2
          mkdir -p /usr/local/lib/docker/cli-plugins /opt/videohelper /var/lib/videohelper /etc/docker
          curl -fL --retry 3 https://github.com/docker/compose/releases/download/v5.6.1/docker-compose-linux-x86_64 -o /usr/local/lib/docker/cli-plugins/docker-compose
          echo '47737f4236e6d3ccea7291995203f8f018058783b4c3a9469119811a0b5db8c0  /usr/local/lib/docker/cli-plugins/docker-compose' | sha256sum -c -
          chmod 755 /usr/local/lib/docker/cli-plugins/docker-compose
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path('/etc/docker/daemon.json')
          data = json.loads(p.read_text()) if p.exists() else {}
          data.update({'log-driver': 'json-file', 'log-opts': {'max-size': '10m', 'max-file': '3'}})
          p.write_text(json.dumps(data))
          PY
          systemctl enable docker amazon-ssm-agent
          systemctl restart docker
          umask 077
          cat >/opt/videohelper/aws.env <<'EOF'
          AWS_REGION=${AWS::Region}
          MEDIA_BUCKET=${MediaBucket}
          ARTIFACTS_BUCKET=${ArtifactsBucket}
          IMAGE_REPOSITORY=${Images.RepositoryUri}
          EOF
          touch /opt/videohelper/bootstrap-ready
  BuildLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 7
  BuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: codebuild.amazonaws.com}
            Action: sts:AssumeRole
            Condition:
              StringEquals: {'aws:SourceAccount': !Ref 'AWS::AccountId'}
              ArnEquals:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:codebuild:${AWS::Region}:${AWS::AccountId}:project/${AWS::StackName}-build'
      Policies:
        - PolicyName: PublishAndOperateDemo
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action: [ecr:BatchCheckLayerAvailability, ecr:BatchGetImage, ecr:GetDownloadUrlForLayer, ecr:InitiateLayerUpload, ecr:UploadLayerPart, ecr:CompleteLayerUpload, ecr:PutImage, ecr:DescribeImages]
                Resource: !GetAtt Images.Arn
              - Effect: Allow
                Action: [s3:PutObject, s3:GetObject]
                Resource: !Sub '${ArtifactsBucket.Arn}/releases/*'
              - Effect: Allow
                Action: [ec2:DescribeInstances, ec2:DescribeInstanceStatus, ssm:DescribeInstanceInformation, ssm:GetCommandInvocation]
                Resource: '*'
              - Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${Host}'
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}::document/AWS-RunShellScript'
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt BuildLogs.Arn
              - Effect: Allow
                Action: [codeconnections:GetConnection, codeconnections:GetConnectionToken]
                Resource: !Ref ConnectionArn
              - Effect: Allow
                Action: codeconnections:UseConnection
                Resource: !Ref ConnectionArn
                Condition:
                  StringEquals:
                    codeconnections:FullRepositoryId: !Ref GitHubRepository
                    codeconnections:ProviderAction: [GitPull, GetRepository, GetBranch, GetCommit, ListBranches, IsRepositoryEmpty]
                  StringEqualsIfExists:
                    codeconnections:BranchName: main
  # No VPC attachment: the short-lived builder needs public package registries without a NAT gateway.
  BuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${AWS::StackName}-build'
      ServiceRole: !GetAtt BuildRole.Arn
      Artifacts: {Type: NO_ARTIFACTS}
      ConcurrentBuildLimit: 1
      TimeoutInMinutes: 120
      QueuedTimeoutInMinutes: 30
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        PrivilegedMode: true
        EnvironmentVariables:
          - {Name: AWS_REGION, Value: !Ref 'AWS::Region'}
          - {Name: VH_INSTANCE_ID, Value: !Ref Host}
          - {Name: VH_ARTIFACTS_BUCKET, Value: !Ref ArtifactsBucket}
          - {Name: VH_IMAGE_REPOSITORY, Value: !GetAtt Images.RepositoryUri}
      Source:
        Type: GITHUB
        Location: !Sub 'https://github.com/${GitHubRepository}.git'
        GitCloneDepth: 1
        BuildSpec: deploy/aws/buildspec.yaml
        Auth: {Type: CODECONNECTIONS, Resource: !Ref ConnectionArn}
      SourceVersion: refs/heads/main
      Cache: {Type: LOCAL, Modes: [LOCAL_DOCKER_LAYER_CACHE]}
      LogsConfig:
        CloudWatchLogs: {Status: ENABLED, GroupName: !Ref BuildLogs}
      Triggers:
        Webhook: true
        FilterGroups:
          - - {Type: EVENT, Pattern: PUSH}
            - {Type: HEAD_REF, Pattern: '^refs/heads/main$'}
            - {Type: FILE_PATH, Pattern: '^(.agents/|docs/|[^/]+\.md$)', ExcludeMatchedPattern: true}
      Tags: [{Key: Project, Value: videohelper}, {Key: Environment, Value: demo}]
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Condition: HasBudgetEmail
    Properties:
      Budget:
        BudgetName: !Sub '${AWS::StackName}-monthly'
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: {Amount: 40, Unit: USD}
      NotificationsWithSubscribers:
        - Notification: {NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 50, ThresholdType: PERCENTAGE}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref BudgetEmail}]
        - Notification: {NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref BudgetEmail}]
Outputs:
  InstanceId: {Value: !Ref Host}
  MediaBucket: {Value: !Ref MediaBucket}
  ArtifactsBucket: {Value: !Ref ArtifactsBucket}
  ImageRepository: {Value: !GetAtt Images.RepositoryUri}
  BuildProjectName: {Value: !Ref BuildProject}
