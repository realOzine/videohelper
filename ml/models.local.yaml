# 本地真实模型：uv sync --extra wemm --extra asr；ML_FAKE=0，ML_MODELS_FILE=models.local.yaml。
# WeMM 使用 Mac MPS float16，ASR 使用 CPU float32，避免同时占用 Metal 内存。
models:
  - id: wemm-2b@r1
    kind: embedder
    adapter: wemm
    weights: tencent/WeMM-Embedding-2B
    revision: bbd6cd4bf52cfc6716f752a2df80b2706720bd95
    device: mps
    dtype: float16
    dim: 1024
    metric: cosine
    query_inputs: [text]
    doc_inputs: [text, video, image]
    max_batch: 32
    max_span_ms: 30000
    max_concurrency: 1
    queue_limit: 8
    preprocess:
      adapter_version: 1
      transformers_version: 5.2.0
      use_fast: true
      frames_per_clip: 4
      image_min_pixels: 65536
      image_max_pixels: 262144
      video_min_pixels: 4096
      video_max_pixels: 262144
      max_tokens: 4096
  - id: paraformer-zh@r1
    kind: transcriber
    adapter: funasr
    weights: funasr/paraformer-zh
    revision: d7811ee3ac581fbcfdeb37c98c6ba674028433dc
    device: cpu
    dtype: float32
    max_concurrency: 1
    queue_limit: 4
    max_window_ms: 900000
    languages: [zh]
    preprocess:
      adapter_version: 1
      funasr_version: 1.3.14
      pred_timestamp: true
      sample_rate: 16000
      ncpu: 2
      max_single_segment_time: 30000
      batch_size_s: 30
      batch_size_threshold_s: 30
      vad_model:
        weights: funasr/fsmn-vad
        revision: df20e6b30c653645fa4ff125cacfcabd1020a669
      punc_model:
        weights: funasr/ct-punc
        revision: d0e55e2b8722a78b63705ff443d09c4f86e5d750
