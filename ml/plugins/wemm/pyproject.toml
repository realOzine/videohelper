[build-system]
requires = ["setuptools>=75,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "videohelper-ml-wemm"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = ["videohelper-ml==0.1.0"]

[project.optional-dependencies]
inference = ["torch>=2.10,<3", "torchvision>=0.25,<1", "transformers==5.2.0", "accelerate>=1.1,<2"]

[project.entry-points."videohelper.ml.adapters.v1"]
wemm = "videohelper_ml_wemm:WeMMEmbedder"

[tool.setuptools]
packages = ["videohelper_ml_wemm"]
