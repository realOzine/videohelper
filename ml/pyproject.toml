[build-system]
requires = ["setuptools>=75,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "videohelper-ml"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "pillow>=11,<13", "numpy>=2.2,<3", "av>=14,<17", "pyyaml>=6,<7",
]

[project.scripts]
videohelper-ml = "app.cli:main"

[project.optional-dependencies]
clap = ["videohelper-ml-clap[inference]==0.1.0"]
asr = ["videohelper-ml-funasr[inference]==0.1.0"]
wemm = ["videohelper-ml-wemm[inference]==0.1.0"]

[tool.uv.sources]
videohelper-ml-wemm = {path = "plugins/wemm", editable = true}
videohelper-ml-funasr = {path = "plugins/funasr", editable = true}
videohelper-ml-clap = {path = "plugins/clap", editable = true}

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["resources/*.yaml"]

[dependency-groups]
dev = [
  "videohelper-ml-wemm==0.1.0", "videohelper-ml-funasr==0.1.0", "videohelper-ml-clap==0.1.0",
  "pytest>=8,<9", "httpx>=0.28,<1", "ruff>=0.11,<1", "jsonschema>=4.23,<5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
