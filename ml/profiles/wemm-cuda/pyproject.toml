[project]
name = "videohelper-profile-wemm-cuda"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "videohelper-ml==0.1.0",
  "videohelper-ml-wemm[inference]==0.1.0",
  "torch==2.14.1",
  "torchvision==0.29.1",
]

[tool.uv]
package = false
environments = ["(sys_platform == 'linux' and platform_machine == 'x86_64') or (sys_platform == 'win32' and platform_machine == 'AMD64')"]

[tool.uv.sources]
videohelper-ml = { path = "../.." }
videohelper-ml-wemm = { path = "../../plugins/wemm" }
torch = { index = "pytorch-cuda" }
torchvision = { index = "pytorch-cuda" }

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
