[project]
name = "videohelper-profile-wemm-cuda"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "videohelper-ml==0.1.0",
  "videohelper-ml-wemm[inference]==0.1.0",
  "torch==2.10.0",
  "torchvision==0.25.0",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
videohelper-ml = { path = "../.." }
videohelper-ml-wemm = { path = "../../plugins/wemm" }
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
