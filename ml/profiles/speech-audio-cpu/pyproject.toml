[project]
name = "videohelper-profile-speech-audio-cpu"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "videohelper-ml==0.1.0",
  "videohelper-ml-funasr[inference]==0.1.0",
  "videohelper-ml-clap[inference]==0.1.0",
  "torch==2.10.0",
  "torchaudio==2.10.0",
]

[tool.uv]
package = false
environments = ["(sys_platform == 'darwin' and platform_machine == 'arm64') or (sys_platform == 'linux' and platform_machine == 'x86_64')"]

[tool.uv.sources]
videohelper-ml = { path = "../.." }
videohelper-ml-funasr = { path = "../../plugins/funasr" }
videohelper-ml-clap = { path = "../../plugins/clap" }
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
